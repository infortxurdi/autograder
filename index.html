<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Autograder</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .lang-home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      text-align: center;
      padding: 1.5rem;
    }
    .lang-cards {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .lang-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 1.5rem 2.5rem;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .lang-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }
    .lang-card img {
      width: 48px;
      height: auto;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="lang-home">
    <h1>Java Autograder</h1>
    <p>Aukeratu hizkuntza / Selecciona el idioma</p>

    <div class="lang-cards">
      <a href="eus/index.html" class="lang-card">
        <img src="eus.png" alt="Euskara">
        <span>Euskara</span>
      </a>
      <a href="es/index.html" class="lang-card">
        <img src="es.png" alt="Español">
        <span>Español</span>
      </a>
    </div>
  </main>
</body>
</html>
